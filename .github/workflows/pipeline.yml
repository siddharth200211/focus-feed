# Phase 2 pipeline: Python jobs that collect and score into BigQuery, then dbt builds the feed.
#
#  - every push / pull request touching pipeline/, dbt/ or apps-script/: pytest, including the
#    parity tests that keep Phase 1 (Apps Script) and Phase 2 (Python + dbt) in agreement, and
#    the dbt project run end to end on DuckDB
#  - daily at 09:15 UTC (14:45 IST): collect, score, build (each runs even if the one before
#    failed, so leftovers still get scored and the feed is rebuilt from what there is)
#  - Actions → "Pipeline" → Run workflow: run one command by hand
#      check   settings, keys, Gemini model names, BigQuery access
#      setup   create the dataset and tables
#      seed    copy Phase 1's raw_videos, scored_videos and events into an empty BQ_DATASET
#      daily / collect / score / build
#      compare  Phase 1's feed against Phase 2's, before switching over
#      adopt    at the switch-over: copy Phase 2's own rows from <BQ_DATASET>_v2 (docs/phase2-setup.md, step 9)
#
# Google sign-in is keyless (Workload Identity Federation): see docs/phase2-setup.md for the
# variables and secrets. Without WIF_PROVIDER the scheduled jobs skip themselves.
name: Pipeline

on:
  push:
    branches: [main]
    paths: ['pipeline/**', 'dbt/**', 'apps-script/**', '.github/workflows/pipeline.yml']
  pull_request:
    paths: ['pipeline/**', 'dbt/**', 'apps-script/**', '.github/workflows/pipeline.yml']
  schedule:
    - cron: '15 9 * * *'
  workflow_dispatch:
    inputs:
      command:
        description: What to run
        type: choice
        options: [check, setup, seed, daily, collect, score, build, compare, adopt]
        default: check

permissions:
  contents: read

jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: pip install -e "pipeline[dev]"
      - run: python -m pytest pipeline -q

  run:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: focusfeed-pipeline
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write   # lets GitHub hand Google a short-lived token for this run
    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      SHEET_ID: ${{ vars.SHEET_ID }}
      BQ_DATASET: ${{ vars.BQ_DATASET }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      COMMAND: ${{ github.event_name == 'schedule' && 'daily' || inputs.command }}
    steps:
      - name: Check pipeline settings
        id: cfg
        run: |
          if [ -z "${{ vars.WIF_PROVIDER }}" ] || [ -z "${{ vars.SERVICE_ACCOUNT }}" ] || [ -z "$SHEET_ID" ]; then
            echo "::notice title=Pipeline skipped::Add WIF_PROVIDER, SERVICE_ACCOUNT and SHEET_ID (see docs/phase2-setup.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.cfg.outputs.ready == 'true'

      - uses: google-github-actions/auth@v3
        if: steps.cfg.outputs.ready == 'true'
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.SERVICE_ACCOUNT }}

      - uses: actions/setup-python@v6
        if: steps.cfg.outputs.ready == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml

      - name: Install
        id: install
        if: steps.cfg.outputs.ready == 'true'
        run: pip install -e "pipeline[dbt]"

      - name: focusfeed ${{ env.COMMAND }}
        if: steps.cfg.outputs.ready == 'true' && contains(fromJSON('["check", "setup", "seed", "compare", "adopt"]'), env.COMMAND)
        run: python -m focusfeed "$COMMAND"

      - name: Collect
        id: collect
        if: steps.cfg.outputs.ready == 'true' && (env.COMMAND == 'daily' || env.COMMAND == 'collect')
        run: python -m focusfeed collect

      - name: Score
        # ${{ }} because the expression starts with "!"; !cancelled() = run even if collect failed
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (env.COMMAND == 'daily' || env.COMMAND == 'score') }}
        run: python -m focusfeed score

      - name: Build feed (dbt)
        if: ${{ !cancelled() && steps.install.outcome == 'success' && (env.COMMAND == 'daily' || env.COMMAND == 'build') }}
        run: python -m focusfeed build
